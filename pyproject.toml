[project]
name = "lgpd-scan"
version = "0.1.0.dev0"
description = "Encontra dados pessoais brasileiros em planilhas e bancos, avalia o risco e anonimiza."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
lgpd-scan = "lgpd_scan.cli:executar"

[build-system]
requires = ["uv_build>=0.13.9,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
  "mypy==2.4.1",
  "pre-commit==4.7.0",
  "pytest==9.2.0",
  "ruff==0.17.5", # manter igual à rev do ruff-pre-commit
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "W", # pycodestyle
  "F",      # pyflakes
  "I",      # ordem de imports
  "B",      # bugbear: armadilhas comuns
  "UP",     # sintaxe moderna para a versão mínima
  "SIM",    # simplificações
  "RUF",    # regras próprias do Ruff
]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
